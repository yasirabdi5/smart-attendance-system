<html lang="en">
    <head>
        <mata charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale-1.0">
        <title>Login - Smart Attendance System</title>
        <style>
            body {
                font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        .login-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn-submit {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-submit:hover {
            background-color: #0056b3;
        }
        </style>
        </mata>
    </head>
    <body>
        <div class="login-container">
            <h2> Smart Attendance System - Login</h2>
            <form action="/login" method="post">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="register-link" style="text-align: center; margin-top: 15px; font-size: 14px;">
    Don't have an account? <a href="/register" style="color: #007bff; text-decoration: none;">Register here</a>
</div>
                <button type="submit" class="btn-submit">Login</button>
            </form>
        </div>
    </body>
</html>
