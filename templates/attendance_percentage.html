<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance Summary</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h2>Student-wise Attendance Summary</h2>
        <a href="{{ url_for('home') }}" class="btn">Back to Dashboard</a>
        
        <table style="width:100%; margin-top: 20px; border-collapse: collapse;" border="1">
            <thead>
                <tr>
                    <th>Roll No</th>
                    <th>Student Name</th>
                    <th>Total Present</th>
                    <th>Total Absent</th>
                    <th>Overall Percentage</th>
                </tr>
            </thead>
            <tbody>
                {% for s in students %}
                <tr>
                    <td>{{ s.roll_no }}</td>
                    <td>{{ s.name }}</td>
                    <td style="color: green; font-weight: bold;">{{ s.present_days }}</td>
                    <td style="color: red; font-weight: bold;">{{ s.absent_days }}</td>
                    <td>{{ s.percentage }}%</td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="5" style="text-align: center;">No attendance records found.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
