<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attendance System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>

    <nav class="navbar">
        <div class="logo">
            Smart Attendance
        </div>

        <div class="nav-links">
            <a href="/">Dashboard</a>
            <a href="/students">Students</a>
            <a href="/attendance">Attendance</a>
            <a href="/logout" style="color: #dc3545;">Logout</a>
        </div>
    </nav>

    <main class="container">

        <h1>Attendance Dashboard</h1>
        <p class="subtitle">
            Manage students and track attendance easily.
        </p>

        <div class="stats">
            <div class="card">
                <h3>Total Students</h3>
                <p>{{ total_students }}</p>
            </div>

            <div class="card">
                <h3>Present Today</h3>
                <p>{{ present_today }}</p>
            </div>

            <div class="card">
                <h3>Absent Today</h3>
                <p>{{ absent_today }}</p>
            </div>
        </div>

        <div class="actions">
            <a href="/students" class="button">
                Add Student
            </a>

            <a href="/attendance" class="button">
                Mark Attendance
            </a>

            <a href="/attendance" class="button">
                View Attendance
            </a>
        </div>

    </main>

</body>
</html>
