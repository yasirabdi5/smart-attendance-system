<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Attendance - Smart Attendance System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

    <nav class="navbar">
        <div class="logo">Smart Attendance</div>
        <div class="nav-links">
            <a href="/">Dashboard</a>
            <a href="/students">Students</a>
            <a href="/attendance">Attendance</a>
            <a href="/logout" style="color: #dc3545;">Logout</a>
        </div>
    </nav>

    <div class="container" style="max-width: 800px; margin-top: 30px; background: white; padding: 20px; border-radius: 8px;">
        <h2>Attendance Records</h2>
        <a href="/attendance/mark" class="button" style="display: inline-block; margin-bottom: 20px; background-color: #28a745; text-decoration: none; padding: 8px 12px; color: white; border-radius: 4px;">+ Mark New Attendance</a>
        
        <table style="width: 100%; border-collapse: collapse; margin-top: 10px;">
            <thead>
                <tr style="background-color: #007bff; color: white;">
                    <th style="padding: 10px; border: 1px solid #ddd;">Student</th>
                    <th style="padding: 10px; border: 1px solid #ddd;">Roll No</th>
                    <th style="padding: 10px; border: 1px solid #ddd;">Date</th>
                    <th style="padding: 10px; border: 1px solid #ddd;">Status</th>
                </tr>
            </thead>
            <tbody>
                {% for record in records %}
                <tr>
                    <td style="padding: 10px; border: 1px solid #ddd;">{{ record.name }}</td>
                    <td style="padding: 10px; border: 1px solid #ddd;">{{ record.roll_no }}</td>
                    <td style="padding: 10px; border: 1px solid #ddd;">{{ record.date }}</td>
                    <td style="padding: 10px; border: 1px solid #ddd;">{{ record.status }}</td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="4" style="text-align: center; padding: 15px;">No attendance records found.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</body>
</html>
