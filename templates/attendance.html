<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Attendance - Smart Attendance System</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2, h3 { color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; }
        select, input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { background-color: #28a745; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
        .btn:hover { background-color: #218838; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #007bff; color: white; }
        .nav-links { margin-bottom: 20px; }
        .nav-links a { margin-right: 15px; color: #007bff; text-decoration: none; }
        .nav-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/students">Manage Students</a>
        <a href="/attendance">Attendance</a>
        <a href="/logout" style="color: #dc3545;">Logout</a>
    </div>

    <h2>Mark Attendance</h2>
    <form action="/attendance/mark" method="POST">
        <div class="form-group">
            <label for="student_id">Select Student</label>
            <select name="student_id" id="student_id" required>
                <option value="">-- Choose Student --</option>
                {% for student in students %}
                    <option value="{{ student.id }}">{{ student.name }} (Roll: {{ student.roll_no }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="date">Date</label>
            <input type="text" name="date" id="date" value="10-09-2026" required>
        </div>

        <div class="form-group">
            <label for="status">Status</label>
            <select name="status" id="status" required>
                <option value="Present">Present</option>
                <option value="Absent">Absent</option>
            </select>
        </div>

        <button type="submit" class="btn">Submit Attendance</button>
    </form>

    <h3 style="margin-top: 40px;">Attendance Records</h3>
    <table>
        <thead>
            <tr>
                <th>Student</th>
                <th>Roll No</th>
                <th>Date</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            {% for record in records %}
            <tr>
                <td>{{ record.name }}</td>
                <td>{{ record.roll_no }}</td>
                <td>{{ record.date }}</td>
                <td>{{ record.status }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="4" style="text-align: center;">No attendance records found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

</body>
</html>
