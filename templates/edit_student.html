<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Student - Smart Attendance</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>

    <nav class="navbar">
        <div class="logo">
            Smart Attendance
        </div>

        <div class="nav-links">
            <a href="/">Dashboard</a>
            <a href="/students">Students</a>
            <a href="/attendance">Attendance</a>
            <a href="/logout" style="color: #dc3545;">Logout</a>
        </div>
    </nav>

    <main class="container">

        <h1>Edit Student</h1>

        <p class="subtitle">
            Update student information.
        </p>

        <form method="POST" class="student-form">

            <label for="name">Student Name</label>

            <input
                type="text"
                id="name"
                name="name"
                value="{{ student.name }}"
                required
            >

            <label for="roll_no">Roll Number</label>

            <input
                type="text"
                id="roll_no"
                name="roll_no"
                value="{{ student.roll_no }}"
                required
            >

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                value="{{ student.email }}"
                required
            >

            <button type="submit" class="button">
                Update Student
            </button>

            <a href="/students"
                style="
                    display: inline-block;
                    margin-top: 10px;
                    text-decoration: none;
                    color: #60a5fa;
                ">
                ← Back to Students
            </a>

        </form>

    </main>

</body>
</html>
