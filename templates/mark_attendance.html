<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automatic Attendance</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    <div class="container">

        <h2>Automatic Attendance</h2>

        <p>
            Students can show their face one by one.
            The system will automatically recognize and mark attendance.
        </p>

        <a href="{{ url_for('home') }}"
           class="btn"
           style="background-color: #6c757d;">
            Back to Dashboard
        </a>

        <div class="webcam-container"
             style="margin-top: 20px; text-align: center;">

            <video
                id="video"
                width="640"
                height="480"
                autoplay
                playsinline
                style="border: 2px solid #ccc; border-radius: 8px;">
            </video>

            <canvas
                id="canvas"
                width="640"
                height="480"
                style="display: none;">
            </canvas>

        </div>

        <div
            id="result-message"
            style="
                margin-top: 20px;
                font-weight: bold;
                font-size: 18px;
                text-align: center;
            ">
            Starting camera...
        </div>

        <div
            id="attendance-status"
            style="
                margin-top: 20px;
                text-align: center;
            ">
        </div>

    </div>

    <script>
        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        const resultMessage = document.getElementById("result-message");
        const attendanceStatus = document.getElementById("attendance-status");

        let stream = null;
        let scanning = false;

        // Start webcam automatically
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: true
                });

                video.srcObject = stream;
                scanning = true;

                resultMessage.style.color = "green";
                resultMessage.innerText =
                    "Camera ready. Please show your face.";

                startScanning();

            } catch (error) {
                console.error("Webcam access error:", error);

                resultMessage.style.color = "red";
                resultMessage.innerText =
                    "Webcam access denied or not available.";
            }
        }

        // Capture a frame and send it to Flask
        async function scanFrame() {

            if (!scanning) {
                return;
            }

            const context = canvas.getContext("2d");

            context.drawImage(
                video,
                0,
                0,
                canvas.width,
                canvas.height
            );

            const imageData = canvas.toDataURL("image/jpeg");

            try {

                const response = await fetch(
                    "{{ url_for('mark_attendance') }}",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            image: imageData
                        })
                    }
                );

                const data = await response.json();

                if (data.success) {

                    resultMessage.style.color = "green";

                    resultMessage.innerText =
                        `✓ Attendance marked for ${data.student_name} (${data.roll_no})`;

                    const item = document.createElement("p");

                    item.innerText =
                        `✓ ${data.student_name} (${data.roll_no}) - Present`;

                    attendanceStatus.prepend(item);

                }
                else if (data.message) {

                    resultMessage.style.color = "#555";
                    resultMessage.innerText = data.message;

                }

            } catch (error) {

                console.error("Attendance error:", error);

                resultMessage.style.color = "red";
                resultMessage.innerText =
                    "Error communicating with the attendance system.";
            }
        }

        // Keep scanning continuously
        function startScanning() {

            setInterval(() => {

                if (scanning) {
                    scanFrame();
                }

            }, 2000);
        }

        // Stop camera when leaving the page
        window.addEventListener("beforeunload", () => {

            scanning = false;

            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }

        });

        // Start camera when page loads
        startCamera();
    </script>

</body>
</html>
